---
deployment:
  tasks:
    # cPanel runs these as one shell, so $HOME and exported vars carry over.
    # $HOME avoids hard-coding the cPanel username.

    # Subdomains land in one of these two layouts depending on cPanel version.
    - export DOCROOT="$HOME/ryansoftwareenginer.rzdigitalcreative.my.id"
    - if [ ! -d "$DOCROOT" ]; then export DOCROOT="$HOME/public_html/ryansoftwareenginer"; fi
    - if [ ! -d "$DOCROOT" ]; then export DOCROOT="$HOME/public_html"; fi
    - echo "=== deploying to $DOCROOT ==="

    - /bin/mkdir -p "$DOCROOT/css" "$DOCROOT/js" "$DOCROOT/images"

    - /bin/cp -f index.html "$DOCROOT/"
    - /bin/cp -f .htaccess  "$DOCROOT/"
    - /bin/cp -Rf css/.     "$DOCROOT/css/"
    - /bin/cp -Rf js/.      "$DOCROOT/js/"
    - /bin/cp -Rf images/.  "$DOCROOT/images/"

    # Raw source photos should not be published
    - /bin/rm -rf "$DOCROOT/images/originals"

    - echo "=== deployed files ===" && ls -la "$DOCROOT"
